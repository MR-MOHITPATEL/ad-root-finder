# Competitors to scan for ad roots. Edit freely — no code changes needed.
#
# tier:
#   every_run   -> scanned on every `run.py scan` and the daily refresh
#   broad_only  -> scanned only with `run.py scan --broad`
#
# page_ids:  the exact Meta Ad Library advertiser page id(s). STRONGLY preferred —
#            keyword search is unreliable (misses pages, picks reseller pages).
#            To find one: open facebook.com/ads/library, search the brand, click the
#            brand's page, copy the number after `view_all_page_id=` in the URL.
# search:    fallback keyword used only when page_ids is empty.

defaults:
  country: IN
  media_type: all
  active_status: active
  max_ads: 80

